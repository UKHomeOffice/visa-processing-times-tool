suite: app pdb common labels
templates:
  - templates/app-pdb.yaml
tests:
  - it: renders custom common labels on the app pod disruption budget metadata
    set:
      app:
        replicas: 2
      commonLabels:
        app.kubernetes.io/name: should-not-override
        app.kubernetes.io/instance: should-not-override
        team: platform
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.labels.team
          value: platform
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: viptt-app
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
